<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Invoice Generation</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="auth-loading" class="auth-loading">Checking session…</div>
  <div id="login-wrap" class="login-wrap hidden">
    <form id="login-form" class="card login-card">
      <h1>Invoice Generation</h1>
      <p class="hint">Sign in with username or email</p>
      <div id="login-error" class="error-box hidden" role="alert"></div>
      <label>
        Username / Email
        <input id="login-identifier" name="identifier" autocomplete="username" required />
      </label>
      <label>
        Password
        <input id="login-password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn primary" id="login-btn">Login</button>
    </form>
  </div>
  <script>
    (async function () {
      const loading = document.getElementById("auth-loading");
      const wrap = document.getElementById("login-wrap");
      try {
        const res = await fetch("/api/auth/me", { credentials: "include" });
        const data = await res.json();
        if (data.authenticated) {
          window.location.replace("/");
          return;
        }
      } catch (_) { /* show login */ }
      loading.classList.add("hidden");
      wrap.classList.remove("hidden");
    })();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("login-error");
      const btn = document.getElementById("login-btn");
      err.classList.add("hidden");
      btn.disabled = true;
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            identifier: document.getElementById("login-identifier").value.trim(),
            password: document.getElementById("login-password").value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          err.textContent = data.detail || "Login failed.";
          err.classList.remove("hidden");
          return;
        }
        window.location.replace("/");
      } catch (ex) {
        err.textContent = ex.message || "Login failed.";
        err.classList.remove("hidden");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
